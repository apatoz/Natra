<script>
  //Code test
  //document.getElementById("testText").innerHTML = today;
  //Code kiểm tra số cont
  function validateISO6346(contId) { 
    if (!/^[A-Z]{3}U\d{7}$/.test(contId)) {
      return false;
    }
 
    const charCode = {
    A:10, B:12, C:13, D:14, E:15, F:16, G:17, H:18, I:19,
    J:20, K:21, L:23, M:24, N:25, O:26, P:27, Q:28, R:29,
    S:30, T:31, U:32, V:34, W:35, X:36, Y:37, Z:38
    };
 
    let sum = 0;
 
    for (let i = 0; i < 10; i++) {
    let currentChar = contId[i];
    let val = i < 4
    ? charCode[currentChar]
    : parseInt(currentChar, 10);
     
    sum += val * Math.pow(2, i);
    }
 
    let checkDigit = sum % 11;
 
    if (checkDigit === 10) {
    checkDigit = 0;
    }
 
    return checkDigit === parseInt(contId[10], 10);
}
 
document.getElementById("contId").addEventListener("input", function () {
 
  this.value = this.value.toUpperCase();
 
  if (this.value.length === 11) {
    let isValid = validateISO6346(this.value);
    if (!isValid) { alert("Container không hợp lệ"); }
  }
});
// Code giới hạn ngày DET
const date = new Date();
const year = date.getFullYear();
const month = String(date.getMonth() + 1).padStart(2, '0');
const day = String(date.getDate()).padStart(2, '0');

const today = `${year}-${month}-${day}`;

document.getElementById('inDet').setAttribute('min', today);
</script>
